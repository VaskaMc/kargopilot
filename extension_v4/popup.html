<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <title>PCS Cockpit</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
    .card {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .quota-title {
      font-size: 11px;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .progress-bar {
      height: 6px;
      background: #334155;
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 15%;
      background: linear-gradient(90deg, #10b981, #38bdf8);
      border-radius: 3px;
    }
    .family-badge {
      display: inline-block;
      font-size: 10px;
      padding: 2px 6px;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border-radius: 4px;
      margin-top: 6px;
    }
    .btn {
      width: 100%;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: block;
      text-align: center;
      text-decoration: none;
      margin-top: 6px;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #0284c7;
      color: white;
    }
    .btn-primary:hover {
      background: #0369a1;
    }
    .btn-secondary {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn-secondary:hover {
      background: #334155;
      color: white;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">⚡ PCS Omni-Commerce v4.0</div>
    <div title="Core Online (127.0.0.1:48481)" class="status-dot"></div>
  </div>

  <div class="card">
    <div class="quota-title">
      <span>Aylıq Gömrük Limiti (DGK $300)</span>
      <span id="quota-val">~$45.20 / $300</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="quota-fill"></div>
    </div>
    <div class="family-badge">👤 FİN: 7A123BC (Vasif M.) | $300 Rüsumsuz Limit</div>
  </div>

  <button class="btn btn-primary" id="open-panel-btn">🚀 İdarəetmə Panelini Aç</button>
  <button class="btn btn-secondary" id="open-carriers-btn">📦 Kargo Ünvanları və Filiallar</button>

  <script>
    document.getElementById("open-panel-btn").addEventListener("click", () => {
      chrome.tabs.create({ url: "http://127.0.0.1:48481" });
    });
    document.getElementById("open-carriers-btn").addEventListener("click", () => {
      chrome.tabs.create({ url: "http://127.0.0.1:48481/carriers" });
    });
  </script>
</body>
</html>
